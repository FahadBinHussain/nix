<svg width="980" height="270" viewBox="0 0 980 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nix Project Pulse</title>
  <desc id="desc">A GitHub README activity-style card for Nix showing its archive workflow, private release output, secret-backed state, and cron-ready dispatches.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="980" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7fb"/>
      <stop offset="0.45" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f7fff8"/>
    </linearGradient>
    <linearGradient id="pink" x1="70" y1="70" x2="910" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="978" height="268" rx="18" fill="url(#hero)" stroke="#dbeafe" stroke-width="2"/>
  <rect x="36" y="34" width="908" height="202" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#e5e7eb"/>

  <text x="70" y="72" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Project Pulse</text>
  <text x="70" y="101" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="15">A focused archive template for private Microsoft Store package backups.</text>

  <rect x="675" y="59" width="235" height="24" rx="12" fill="#fdf2f8" stroke="#f9a8d4"/>
  <rect x="690" y="67" width="16" height="8" rx="4" fill="#f472b6"/>
  <rect x="713" y="67" width="16" height="8" rx="4" fill="#f9a8d4"/>
  <rect x="736" y="67" width="16" height="8" rx="4" fill="#f9a8d4"/>
  <rect x="759" y="67" width="16" height="8" rx="4" fill="#f472b6"/>
  <rect x="782" y="67" width="16" height="8" rx="4" fill="#f9a8d4"/>
  <rect x="805" y="67" width="16" height="8" rx="4" fill="#f9a8d4"/>
  <rect x="828" y="67" width="16" height="8" rx="4" fill="#f472b6"/>
  <rect x="851" y="67" width="16" height="8" rx="4" fill="#f9a8d4"/>
  <rect x="874" y="67" width="16" height="8" rx="4" fill="#f9a8d4"/>

  <rect x="70" y="128" width="195" height="76" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="92" y="158" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1 archive workflow</text>
  <text x="92" y="184" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14">Actions-powered updater</text>

  <rect x="286" y="128" width="195" height="76" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="308" y="158" fill="#db2777" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Private releases</text>
  <text x="308" y="184" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14">New packages as assets</text>

  <rect x="502" y="128" width="195" height="76" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="524" y="158" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Secret memory</text>
  <text x="524" y="184" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14">Idempotent version state</text>

  <rect x="718" y="128" width="195" height="76" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="740" y="158" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Cron-ready</text>
  <text x="740" y="184" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14">Dispatch from schedulers</text>

  <rect x="70" y="222" width="840" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="70" y="222" width="632" height="4" rx="2" fill="url(#pink)"/>
</svg>
